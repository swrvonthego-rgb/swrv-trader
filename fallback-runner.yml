name: Fallback Trading Runner

# Runs every 5 minutes during market hours as backup if CF Worker goes down
on:
  schedule:
    # UTC: Mon-Fri, 14:35-20:45 (9:35am-3:45pm ET)
    - cron: "35,40,45,50,55 14 * * 1-5"
    - cron: "*/5 15-19 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45 20 * * 1-5"
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run trading cycle
        run: node src/run-once.js
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        timeout-minutes: 4   # hard kill before next cron fires
